# Settings used for the BiTempQA, LongMemEval-S and LoCoMo runs in the report (GPT-4o-mini harness).
# The LLM harness itself (extraction prompts, hosted readers, judges) is not part of this release.
reader = "gpt-4o-mini"
reader_temperature = 0.0
extractor = "gpt-4o-mini"
extractor_temperature = 0.3
judge = "gpt-4o"
embedding = "BAAI/bge-small-en-v1.5"
retrieval = { dense_top_k = 50, bm25_top_k = 50, fusion = "rrf", slots = 12, hops = 1, raw_episodes = 8 }
modality_tagger = "microsoft/deberta-v3-large"
entity_resolution = { cosine = 0.82, llm_confirm = true }
seeds = [0, 1, 2, 3, 4]

[params]
switch_penalty = 6.0
persistence_weight = 0.5
lookback_days = 30.0
reported_weight = 0.6
recency_per_year = 0.3
temperature = 2.0

[persistence_days]
residence = 365
employer = 540
role = 540
team = 270
manager = 270
preference = 180
project = 90
