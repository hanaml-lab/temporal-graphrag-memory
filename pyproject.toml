[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-memory"
version = "0.1.0"
description = "LEDGER: order-invariant bitemporal reconciliation for knowledge-graph memory in long-horizon LLM agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manav Agarwal", email = "manav@hanaml.com"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
paper = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
ledger-demo = "ledger.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
